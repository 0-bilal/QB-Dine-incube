<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INCUBE Menu">
<title>INCUBE Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="css/menu.css">
</head>
<body>
<div id="fit"><div id="stage">
  <section class="media" id="media" aria-label="صور المنتجات والإعلانات">
    <div class="wordmark" id="wordmark"></div>
    <div id="slides"></div>
    <div class="focus" id="focus" hidden><img alt=""></div>
    <div class="tag"><div class="card" id="card"></div><div class="dots" id="dots"></div></div>
  </section>

  <section class="menu" id="menu" dir="rtl">
    <div class="top">
      <h1 class="title" id="title"></h1>
      <div class="tools">
        <span class="auto" id="auto"><b></b><span id="autoTxt"></span></span>
        <button class="btn" id="lang" type="button">EN</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="sheet" id="sheet"></div>
  </section>
</div></div>

<script src="js/defaults.js"></script>
<script src="js/store.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
