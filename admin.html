<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>INCUBE Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="lock" id="lock" hidden>
  <form class="lockbox" id="lockForm">
    <div class="brand">INCUBE</div>
    <h1>لوحة التحكم</h1>
    <label for="pin">رمز الدخول</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <p class="err" id="pinErr" hidden>الرمز غير صحيح، حاول مرة أخرى.</p>
    <button class="b primary" type="submit">دخول</button>
  </form>
</div>

<div class="app" id="app" hidden>
  <header class="bar">
    <div class="brand">INCUBE <span>لوحة التحكم</span></div>
    <div class="bar-tools">
      <span class="saved" id="saved">كل التعديلات محفوظة على هذا الجهاز</span>
      <a class="b" href="index.html" target="_blank" rel="noopener">عرض المنيو ↗</a>
    </div>
  </header>
  <div class="body">
    <nav class="nav" id="nav">
      <button type="button" data-tab="menu" class="on"><b>١</b>الأصناف والأسعار</button>
      <button type="button" data-tab="panel"><b>٢</b>اللوحة الإعلانية</button>
      <button type="button" data-tab="ads"><b>٣</b>الإعلانات</button>
      <button type="button" data-tab="texts"><b>٤</b>النصوص والإعدادات</button>
      <button type="button" data-tab="backup"><b>٥</b>النسخ الاحتياطي</button>
    </nav>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true">
    <p id="mText"></p>
    <div class="mbtns"><button class="b primary" id="mOk" type="button">موافق</button><button class="b" id="mNo" type="button">إلغاء</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="jsonPick" accept="application/json,.json" hidden>

<script src="js/defaults.js"></script>
<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
